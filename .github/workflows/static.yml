name: Deploy React App

on:
  push:
    branches: ["master"] # I noticed your branch in the last photo was named master!

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy: # Unique name so it doesn't conflict
    environment:
      name: github-pages
      url: ${{ steps.github-pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        env:
          CI: false
        run: npm run build

      # This automatically picks up your build folder whether it's 'dist' or 'build'
      - name: Upload Production Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            ./dist
            ./build

      - name: Deploy to GitHub Pages
        id: github-pages-deploy
        uses: actions/deploy-pages@v4
